<img class="login-container" src="https://t3.ftcdn.net/jpg/08/10/89/84/360_F_810898439_M7GxeIoecPFWfUaIekY0Qw3q4Kh2l0yO.jpg">

<div class="overlay"></div> <!-- Semi-transparent overlay -->
<div class="form-wrapper">
  <p-card header="Login" class="registration-card" [style]="{backgroundColor:'transparent'}">
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" pInputText />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <p-password id="password" [toggleMask]="true"></p-password>
    </div>

    <p-button label="Login" class="register-btn"></p-button>
  </p-card>
</div>
